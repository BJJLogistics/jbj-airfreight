
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JBJ Air Freight</title>

  <link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #071521;
    }

    #map {
      position: absolute;
      inset: 0;
    }

    .top-panel {
      position: absolute;
      z-index: 5;
      top: 16px;
      left: 16px;
      padding: 13px 17px;
      border: 1px solid rgba(100, 210, 255, .35);
      border-radius: 10px;
      color: white;
      background: rgba(5, 20, 34, .9);
      box-shadow: 0 0 18px rgba(0, 180, 255, .15);
    }

    .top-panel strong {
      display: block;
      font-size: 17px;
      letter-spacing: 1px;
    }

    .top-panel span {
      display: block;
      margin-top: 5px;
      color: #9ddcff;
      font-size: 12px;
    }

    .info {
      position: absolute;
      z-index: 5;
      bottom: 18px;
      left: 16px;
      max-width: calc(100% - 32px);
      padding: 11px 15px;
      color: white;
      background: rgba(5, 20, 34, .9);
      border: 1px solid rgba(100, 210, 255, .35);
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
    }

    .jbj-marker {
      width: 32px;
      height: 32px;
      border: 2px solid #00d9ff;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 10px #00cfff, 0 0 22px rgba(0, 207, 255, .75);
      background: linear-gradient(
        to bottom,
        #ffffff 0%,
        #ffffff 33.33%,
        #00966e 33.33%,
        #00966e 66.66%,
        #d62612 66.66%,
        #d62612 100%
      );
    }

    .jbj-marker::after {
      content: "JBJ";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 2px 3px;
      border-radius: 2px;
      background: rgba(0, 0, 0, .85);
      color: white;
      font-size: 8px;
      font-weight: bold;
      letter-spacing: .3px;
      line-height: 1;
    }

    .airport-label {
      color: white;
      font-size: 10px;
      font-weight: bold;
      text-shadow:
        0 1px 3px #000,
        1px 0 3px #000,
        0 -1px 3px #000,
        -1px 0 3px #000;
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      .top-panel { top: 10px; left: 10px; }
      .info { bottom: 10px; left: 10px; }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="top-panel">
    <strong>JBJ AIR FREIGHT</strong>
    <span>Worldwide Air Cargo Network · Amsterdam Schiphol</span>
  </div>

  <div class="info" id="info">
    Connecting to the worldwide airport network...
  </div>

  <script>
    const home = {
      name: "Amsterdam Schiphol",
      code: "AMS",
      coordinates: [4.7639, 52.3086]
    };

    // 30 international cargo airports around the world.
    const airports = [
      // Asia and Middle East
      { name: "Hong Kong", code: "HKG", coordinates: [113.9185, 22.3080] },
      { name: "Shanghai Pudong", code: "PVG", coordinates: [121.8052, 31.1443] },
      { name: "Seoul Incheon", code: "ICN", coordinates: [126.4505, 37.4602] },
      { name: "Taipei Taoyuan", code: "TPE", coordinates: [121.2328, 25.0797] },
      { name: "Tokyo Narita", code: "NRT", coordinates: [140.3929, 35.7720] },
      { name: "Singapore Changi", code: "SIN", coordinates: [103.9915, 1.3644] },
      { name: "Doha Hamad", code: "DOH", coordinates: [51.6138, 25.2731] },
      { name: "Dubai", code: "DXB", coordinates: [55.3644, 25.2532] },
      { name: "Guangzhou", code: "CAN", coordinates: [113.2988, 23.3924] },
      { name: "Shenzhen", code: "SZX", coordinates: [113.8107, 22.6393] },
      { name: "Beijing Capital", code: "PEK", coordinates: [116.5975, 40.0799] },

      // Europe
      { name: "Frankfurt", code: "FRA", coordinates: [8.5622, 50.0379] },
      { name: "Paris Charles de Gaulle", code: "CDG", coordinates: [2.5479, 49.0097] },

      // North America
      { name: "Memphis", code: "MEM", coordinates: [-89.9767, 35.0424] },
      { name: "Anchorage", code: "ANC", coordinates: [-149.9964, 61.1743] },
      { name: "Louisville", code: "SDF", coordinates: [-85.7360, 38.1744] },
      { name: "Miami", code: "MIA", coordinates: [-80.2906, 25.7959] },
      { name: "Los Angeles", code: "LAX", coordinates: [-118.4081, 33.9416] },
      { name: "Cincinnati", code: "CVG", coordinates: [-84.6678, 39.0488] },
      { name: "Chicago O'Hare", code: "ORD", coordinates: [-87.9073, 41.9742] },

      // Africa
      { name: "Johannesburg", code: "JNB", coordinates: [28.2460, -26.1367] },
      { name: "Addis Ababa", code: "ADD", coordinates: [38.7993, 8.9779] },
      { name: "Nairobi", code: "NBO", coordinates: [36.9278, -1.3192] },
      { name: "Cairo", code: "CAI", coordinates: [31.4056, 30.1219] },
      { name: "Lagos", code: "LOS", coordinates: [3.3212, 6.5774] },

      // South America
      { name: "São Paulo Guarulhos", code: "GRU", coordinates: [-46.4731, -23.4356] },
      { name: "Bogotá", code: "BOG", coordinates: [-74.1469, 4.7016] },
      { name: "Santiago", code: "SCL", coordinates: [-70.7858, -33.3930] },
      { name: "Buenos Aires", code: "EZE", coordinates: [-58.5358, -34.8222] },
      { name: "Lima", code: "LIM", coordinates: [-77.1143, -12.0219] }
    ];

    const map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/fiord",
      center: [10, 20],
      zoom: 1.5,
      minZoom: 1,
      maxZoom: 8,
      attributionControl: true
    });

    map.addControl(new maplibregl.NavigationControl(), "top-right");

    const info = document.getElementById("info");

    function setStatus(message) {
      info.textContent = message;
    }

    function greatCirclePoint(start, end, fraction) {
      const toRadians = value => value * Math.PI / 180;
      const toDegrees = value => value * 180 / Math.PI;

      const lon1 = toRadians(start[0]);
      const lat1 = toRadians(start[1]);
      const lon2 = toRadians(end[0]);
      const lat2 = toRadians(end[1]);

      const a = [
        Math.cos(lat1) * Math.cos(lon1),
        Math.cos(lat1) * Math.sin(lon1),
        Math.sin(lat1)
      ];

      const b = [
        Math.cos(lat2) * Math.cos(lon2),
        Math.cos(lat2) * Math.sin(lon2),
        Math.sin(lat2)
      ];

      const dot = Math.max(-1, Math.min(1,
        a[0] * b[0] + a[1] * b[1] + a[2] * b[2]
      ));

      const angle = Math.acos(dot);

      if (angle < 0.000001) {
        return [
          start[0] + (end[0] - start[0]) * fraction,
          start[1] + (end[1] - start[1]) * fraction
        ];
      }

      const sinAngle = Math.sin(angle);
      const weightA = Math.sin((1 - fraction) * angle) / sinAngle;
      const weightB = Math.sin(fraction * angle) / sinAngle;

      const x = weightA * a[0] + weightB * b[0];
      const y = weightA * a[1] + weightB * b[1];
      const z = weightA * a[2] + weightB * b[2];

      return [
        toDegrees(Math.atan2(y, x)),
        toDegrees(Math.atan2(z, Math.sqrt(x * x + y * y)))
      ];
    }

    function animateMarker(marker, start, end, duration) {
      return new Promise(resolve => {
        const startTime = performance.now();

        function frame(now) {
          const progress = Math.min(1, (now - startTime) / duration);
          const position = greatCirclePoint(start, end, progress);

          marker.setLngLat(position);

          if (progress < 1) {
            requestAnimationFrame(frame);
          } else {
            marker.setLngLat(end);
            resolve();
          }
        }

        marker.setLngLat(start);
        requestAnimationFrame(frame);
      });
    }

    function wait(milliseconds) {
      return new Promise(resolve => setTimeout(resolve, milliseconds));
    }

    function addAirportMarkers() {
      airports.forEach(airport => {
        new maplibregl.Marker({ color: "#00bfff" })
          .setLngLat(airport.coordinates)
          .addTo(map);

        const label = document.createElement("div");
        label.className = "airport-label";
        label.textContent = airport.code + " · " + airport.name;

        new maplibregl.Marker({
          element: label,
          anchor: "left",
          offset: [7, 0]
        })
          .setLngLat(airport.coordinates)
          .addTo(map);
      });

      new maplibregl.Marker({ color: "#00e5ff" })
        .setLngLat(home.coordinates)
        .addTo(map);

      const homeLabel = document.createElement("div");
      homeLabel.className = "airport-label";
      homeLabel.textContent = "AMS · SCHIPHOL · HOME BASE";

      new maplibregl.Marker({
        element: homeLabel,
        anchor: "left",
        offset: [7, 0]
      })
        .setLngLat(home.coordinates)
        .addTo(map);
    }

    function addFlightRoutes() {
      const features = airports.map(airport => ({
        type: "Feature",
        properties: {
          name: airport.name,
          code: airport.code
        },
        geometry: {
          type: "LineString",
          coordinates: Array.from({ length: 101 }, (_, index) =>
            greatCirclePoint(
              home.coordinates,
              airport.coordinates,
              index / 100
            )
          )
        }
      }));

      map.addSource("flight-routes", {
        type: "geojson",
        data: {
          type: "FeatureCollection",
          features
        }
      });

      map.addLayer({
        id: "flight-routes-glow",
        type: "line",
        source: "flight-routes",
        paint: {
          "line-color": "#00aaff",
          "line-width": 3,
          "line-opacity": 0.22,
          "line-blur": 3
        }
      });

      map.addLayer({
        id: "flight-routes-line",
        type: "line",
        source: "flight-routes",
        paint: {
          "line-color": "#26c9ff",
          "line-width": 1.3,
          "line-opacity": 0.7,
          "line-dasharray": [2, 2]
        }
      });
    }

    async function startFlights(marker) {
      let previousIndex = -1;

      while (true) {
        let index;

        do {
          index = Math.floor(Math.random() * airports.length);
        } while (index === previousIndex && airports.length > 1);

        previousIndex = index;

        const destination = airports[index];
        const destinationCoordinates = destination.coordinates;

        setStatus(
          "Departing Schiphol · En route to " +
          destination.name + " (" + destination.code + ")"
        );

        await animateMarker(
          marker,
          home.coordinates,
          destinationCoordinates,
          8000
        );

        marker.setLngLat(destinationCoordinates);

        setStatus(
          "Arrived at " + destination.name +
          " (" + destination.code + ")"
        );

        await wait(1000);

        setStatus("Returning to Amsterdam Schiphol (AMS)");

        await animateMarker(
          marker,
          destinationCoordinates,
          home.coordinates,
          8000
        );

        marker.setLngLat(home.coordinates);

        setStatus("Back at Schiphol · Preparing next flight");

        await wait(1000);
      }
    }

    map.on("load", () => {
      try {
        addFlightRoutes();
        addAirportMarkers();

        const markerElement = document.createElement("div");
        markerElement.className = "jbj-marker";

        const planeMarker = new maplibregl.Marker({
          element: markerElement,
          anchor: "center"
        })
          .setLngLat(home.coordinates)
          .addTo(map);

        setStatus(
          "JBJ Air Freight · 30 cargo airports · Ready for departure from Schiphol"
        );

        startFlights(planeMarker).catch(error => {
          console.error("Flight animation error:", error);
          setStatus("Animation error: " + error.message);
        });

      } catch (error) {
        console.error(error);
        setStatus("Map error: " + error.message);
      }
    });

    map.on("error", event => {
      console.error("MapLibre error:", event.error);
    });
  </script>
</body>
</html>
